name: offline regression

# The offline suite must pass on a fresh checkout: no `services/decider/.runtime/api-token`,
# no `.runtime/` state, no phone. That is the property that OFFLINE-1 broke, so CI runs it on
# every supported Python version rather than only on a developer machine.

on:
  push:
    branches: ["main", "feat/runtime-foundation"]
  pull_request:

jobs:
  offline:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      HARMONY_AGENT_PROFILE: local_off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock -e .
      - name: Dependency consistency
        run: python -m pip check
      - name: Full offline regression
        run: |
          python scripts/reproduce.py
          python -m unittest discover -s tests -v
